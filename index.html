:root{
  /* Call sheet on a sales-floor whiteboard: navy ink on cool paper, highlighter yellow marks anything said out loud or still owed.
     One left-aligned column, rules instead of cards, condensed signage type for dates, clock times and scores. */
  --paper:#F2F5F9; --card:#FFFFFF; --wash:#E7ECF3; --rule:#D0D9E6;
  --ink:#0F1B33; --ink2:#4A5873;
  --hi:#FFD84A; --hi-ink:#0F1B33; --hi-soft:#FFF3BF;
  --link:#1746C7;
  --good:#12754A; --good-soft:#DDF2E6;
  --warn:#9C4D08; --warn-soft:#FBE9D2;
  --bad:#B91C36; --bad-soft:#FADFE4;
  --display:"Big Shoulders Display","Avenir Next Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --r:6px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0B1322; --card:#131D33; --wash:#1A2742; --rule:#2A3A5B;
    --ink:#EDF1F8; --ink2:#A6B4CE;
    --hi:#FFD84A; --hi-ink:#0F1B33; --hi-soft:#352F12;
    --link:#9AB8FF;
    --good:#5FD9A3; --good-soft:#12382A;
    --warn:#F6B56E; --warn-soft:#3C2A13;
    --bad:#FF8E9D; --bad-soft:#42161F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0B1322; --card:#131D33; --wash:#1A2742; --rule:#2A3A5B;
  --ink:#EDF1F8; --ink2:#A6B4CE;
  --hi:#FFD84A; --hi-ink:#0F1B33; --hi-soft:#352F12;
  --link:#9AB8FF;
  --good:#5FD9A3; --good-soft:#12382A;
  --warn:#F6B56E; --warn-soft:#3C2A13;
  --bad:#FF8E9D; --bad-soft:#42161F;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.55;font-variant-numeric:tabular-nums}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--link);text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--link);outline-offset:2px;border-radius:2px}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- frame ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--card)}
.brandwrap{margin-right:auto;display:flex;flex-direction:column;gap:3px;min-width:0}
.brand{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:.01em;text-transform:uppercase;line-height:1;white-space:nowrap}
.status{font-size:.76rem;color:var(--ink2);display:flex;align-items:center;gap:6px;line-height:1.2}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.status[data-state="local"]::before{background:var(--ink2)}
.status[data-state="off"]::before{background:var(--bad)}
.status[data-state="busy"]::before{background:var(--hi)}
main{order:2;flex:1;width:100%;max-width:780px;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;gap:30px}
.nav{order:3;position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0)}
.nav button{background:none;border:0;border-top:4px solid transparent;padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--ink2);min-height:56px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--hi)}
@media (min-width:960px){
  .app{display:grid;grid-template-columns:216px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100%}
  .top{grid-column:1 / -1}
  .brandwrap{flex-direction:row;align-items:center;justify-content:space-between;flex:1;gap:16px;margin-right:4px}
  .nav{grid-column:1;grid-row:2;position:sticky;top:0;bottom:auto;align-self:start;display:flex;flex-direction:column;gap:2px;border-top:0;border-right:1px solid var(--rule);min-height:calc(100vh - 54px);padding:18px 0;background:transparent}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;border-top:0;border-left:5px solid transparent;padding:11px 18px;font-size:.98rem;min-height:0}
  .nav button[aria-current="page"]{border-left-color:var(--hi);background:var(--card)}
  main{grid-column:2;grid-row:2;margin:0;padding:34px 44px 70px;max-width:880px}
}

/* ---------- type ---------- */
h1{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(3rem,13vw,5.4rem);line-height:.86;letter-spacing:-.005em;text-wrap:balance}
h1.page{font-size:clamp(2.5rem,10vw,4rem)}
h2{font-family:var(--display);font-weight:700;font-size:1.75rem;line-height:1.02;letter-spacing:.005em;text-wrap:balance}
h3{font-size:1rem;font-weight:700;line-height:1.3}
.lede{font-size:1.08rem;max-width:62ch}
.note{color:var(--ink2);font-size:.9rem;max-width:68ch}
.when{font-weight:600;color:var(--ink2)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.spread{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px}
section{display:flex;flex-direction:column;gap:14px}
.prose{display:flex;flex-direction:column;gap:10px;max-width:68ch}
.prose ul{display:flex;flex-direction:column;gap:6px;padding-left:1.15em;list-style:square}
.prose li::marker{color:var(--ink2)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:var(--r);border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700;font-size:.95rem;text-decoration:none;line-height:1.15}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{min-height:34px;padding:4px 11px;font-size:.84rem;border-width:1.5px}
.btn.hi{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--link);text-decoration:underline;text-underline-offset:2px;font-weight:600;text-align:left}
input[type=text],input[type=url],input[type=date],input[type=number],select,textarea{width:100%;min-height:42px;padding:8px 10px;border:1.5px solid var(--rule);border-radius:var(--r);background:var(--card);color:var(--ink)}
textarea{min-height:92px;resize:vertical;line-height:1.5}
input:hover,select:hover,textarea:hover{border-color:var(--ink2)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:600;color:var(--ink2)}
label.f > span.h{font-weight:400}
.grid2{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.grid2{grid-template-columns:1fr 1fr}}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--rule);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:9px 12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--hi)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--rule);background:transparent;border-radius:999px;padding:5px 12px;font-size:.84rem;font-weight:600;color:var(--ink2);min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* checkbox: a square you can hit with a thumb */
.ck{appearance:none;-webkit-appearance:none;flex:none;width:28px;height:28px;margin:0;border:2px solid var(--ink);border-radius:4px;background:var(--card);display:grid;place-content:center;cursor:pointer}
.ck::after{content:"";width:13px;height:7px;border-left:3px solid var(--hi-ink);border-bottom:3px solid var(--hi-ink);transform:rotate(-45deg) translateY(-1px) scale(0);transition:transform .12s ease-out}
.ck:checked{background:var(--hi);border-color:var(--hi)}
.ck:checked::after{transform:rotate(-45deg) translateY(-1px) scale(1)}
@media (prefers-reduced-motion:reduce){.ck::after{transition:none}}

/* ---------- call sheet ---------- */
.hero{gap:12px}
.sheet{border-top:3px solid var(--ink);background:var(--card)}
.sheet > li{display:grid;grid-template-columns:3.6rem minmax(0,1fr) auto;gap:12px;align-items:start;padding:13px 12px 13px 10px;border-bottom:1px solid var(--rule)}
.sheet .t{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.05}
.sheet .t small{display:block;font-family:var(--body);font-size:.72rem;font-weight:600;color:var(--ink2);margin-top:1px}
.sheet .d{display:flex;flex-direction:column;gap:5px;min-width:0}
.sheet li.done .d > span{color:var(--ink2);text-decoration:line-through;text-decoration-thickness:1.5px}
.targets{display:flex;flex-wrap:wrap;gap:6px 18px;font-weight:600}
.targets b{font-family:var(--display);font-size:1.5rem;font-weight:800;line-height:1;margin-right:5px}
.stamp{align-self:flex-start;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.1rem;letter-spacing:.04em;padding:3px 10px;background:var(--hi);color:var(--hi-ink);transform:rotate(-2deg)}

/* ---------- scoreboard ---------- */
.score{border-top:3px solid var(--ink);background:var(--card)}
.score > li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:end;padding:12px;border-bottom:1px solid var(--rule)}
.score .lab{font-weight:700}
.score .lab small{display:block;font-weight:400;color:var(--ink2);font-size:.82rem}
.score .num{font-family:var(--display);font-weight:800;font-size:2.3rem;line-height:.9;text-align:right;white-space:nowrap}
.score .num span{font-size:1.2rem;font-weight:600;color:var(--ink2)}
.meter{grid-column:1 / -1;position:relative;height:12px;background:var(--wash);border-radius:2px}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:2px;max-width:100%}
.meter b{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--bad);border-radius:1px}
.meter b::after{content:"pace";position:absolute;top:-1.25rem;left:50%;transform:translateX(-50%);font-size:.68rem;font-weight:700;color:var(--bad);font-family:var(--body)}
.score .foot{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--wash);color:var(--ink2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.hi{background:var(--hi);color:var(--hi-ink)}

/* ---------- lists of rows ---------- */
.rows{border-top:3px solid var(--ink);background:var(--card)}
.rows > *{border-bottom:1px solid var(--rule)}
.rows > li,.rows > .rowi{padding:12px}
details > summary{list-style:none;cursor:pointer;padding:12px 38px 12px 12px;position:relative;display:flex;flex-direction:column;gap:4px}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"";position:absolute;right:16px;top:20px;width:9px;height:9px;border-right:2.5px solid var(--ink2);border-bottom:2.5px solid var(--ink2);transform:rotate(45deg);transition:transform .12s}
details[open] > summary::after{transform:rotate(-135deg);top:24px}
@media (prefers-reduced-motion:reduce){details > summary::after{transition:none}}
details > .body{padding:2px 12px 16px;display:flex;flex-direction:column;gap:14px}
.withck{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0;align-items:start}
.withck > .ck{margin:12px 0 0 12px}
.withck > details > summary{padding-left:12px}
.sum-t{font-weight:700;line-height:1.3}
.sum-m{font-size:.86rem;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.is-done .sum-t{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink2)}

/* ---------- words you say out loud / paste ---------- */
.say{border-left:6px solid var(--hi);background:var(--hi-soft);padding:12px 14px;display:flex;flex-direction:column;gap:10px;border-radius:0 var(--r) var(--r) 0}
.say .txt{display:flex;flex-direction:column;gap:9px;font-size:1.02rem;line-height:1.55;max-width:66ch;overflow-wrap:anywhere}
.say .txt ul{padding-left:1.1em;list-style:disc;display:flex;flex-direction:column;gap:4px}
.say .bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:.8rem;font-weight:700;color:var(--ink2)}
.num-ok{font-weight:700;border-bottom:2px solid var(--ink)}
.num-no{background:var(--hi);color:var(--hi-ink);font-weight:700;padding:0 .25em;border-radius:2px}
.blank{color:var(--ink2);font-style:normal;border-bottom:1.5px dashed var(--ink2)}
.kv{display:grid;grid-template-columns:1fr;gap:2px}
.kv dt{font-size:.8rem;font-weight:700;color:var(--ink2)}
.kv dd{margin-bottom:8px}
.trap{border-left:6px solid var(--bad);background:var(--bad-soft);padding:9px 12px;font-size:.93rem;border-radius:0 var(--r) var(--r) 0}
.tip{border-left:6px solid var(--ink2);background:var(--wash);padding:10px 12px;font-size:.93rem;border-radius:0 var(--r) var(--r) 0;max-width:70ch}

/* ---------- pipeline ---------- */
.stagebar{display:inline-grid;grid-auto-flow:column;gap:3px;vertical-align:middle}
.stagebar i{width:14px;height:8px;background:var(--wash);border-radius:1px}
.stagebar i.on{background:var(--ink)}
.stagebar.offer i.on{background:var(--good)}
.stagebar.closed i{background:var(--rule)}
.funnel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:3px solid var(--ink);background:var(--card)}
.funnel > div{padding:10px 8px 12px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.funnel > div:last-child{border-right:0}
.funnel b{display:block;font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:.95}
.funnel span{font-size:.78rem;font-weight:600;color:var(--ink2);line-height:1.2;display:block}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--card);font-size:.94rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
thead th{border-bottom:3px solid var(--ink);font-size:.82rem;color:var(--ink2)}
td.n,th.n{text-align:right;white-space:nowrap}

/* ---------- drill ---------- */
.drill{border-top:3px solid var(--ink);background:var(--card);padding:16px 14px 18px;display:flex;flex-direction:column;gap:14px}
.drill .q{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,7.5vw,2.8rem);line-height:1;text-wrap:balance}
.clock{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:.9}
.clock.over{color:var(--bad)}
.card-term{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,9vw,3.4rem);line-height:.95;text-transform:uppercase}

/* ---------- dialog + toast ---------- */
dialog{border:0;border-top:6px solid var(--hi);padding:0;background:var(--card);color:var(--ink);width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px);border-radius:var(--r)}
dialog::backdrop{background:rgba(8,14,28,.55)}
dialog .in{padding:18px 16px 20px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:20;max-width:calc(100vw - 32px);text-align:center}
@media (min-width:960px){.toast{bottom:28px}}
footer.src{border-top:1px solid var(--rule);padding-top:14px;font-size:.84rem;color:var(--ink2)}
footer.src ul{display:flex;flex-direction:column;gap:5px;margin-top:6px}

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brandwrap">
      <div class="brand">AE Launch Plan</div>
      <div class="status" id="status" data-state="local">Saved in this browser</div>
    </div>
    <button type="button" class="btn small ghost" id="backup-btn" data-act="backup">Backup</button>
  </header>
  <nav class="nav" aria-label="Sections">
    <button type="button" id="nav-today" data-act="nav" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Today</span></button>
    <button type="button" id="nav-plan" data-act="nav" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Plan</span></button>
    <button type="button" id="nav-pipeline" data-act="nav" data-tab="pipeline"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg><span>Pipeline</span></button>
    <button type="button" id="nav-practice" data-act="nav" data-tab="practice"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Practice</span></button>
    <button type="button" id="nav-profile" data-act="nav" data-tab="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1-4 4-5.5 7-5.5s6 1.5 7 5.5"/></svg><span>Profile</span></button>
  </nav>
  <main id="view"></main>
</div>

<dialog id="bk" aria-labelledby="bk-h"><div class="in">
  <div class="spread"><h2 id="bk-h">Backup</h2><button type="button" class="btn small ghost" id="bk-close" data-act="close">Close</button></div>
  <p id="bk-where" class="note"></p>
  <label class="f" for="bk-out">Your backup<textarea id="bk-out" readonly rows="4"></textarea></label>
  <div><button type="button" class="btn small" id="bk-copy" data-act="bkcopy">Copy backup</button></div>
  <label class="f" for="bk-in">Load a backup<textarea id="bk-in" rows="4" placeholder="Paste a backup here"></textarea></label>
  <p id="bk-msg" class="note" role="alert"></p>
  <div class="row"><button type="button" class="btn small" id="bk-load" data-act="bkload">Load this backup</button><button type="button" class="btn small danger" id="bk-reset" data-act="bkreset">Start over</button></div>
</div></dialog>

<dialog id="dlg" aria-labelledby="dlg-title"><div class="in">
  <div class="spread"><h2 id="dlg-title">Copy this text</h2><button type="button" class="btn small ghost" id="dlg-close" data-act="close">Close</button></div>
  <p id="dlg-note" class="note"></p>
  <label class="f" for="dlg-text"><span class="vh">Text</span><textarea id="dlg-text" readonly rows="10"></textarea></label>
</div></dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(function(){
'use strict';
/* ---------- The schedule: two 2-hour blocks a week (Mon and Fri), plus the launch block on Thu Nov 12 ---------- */

const PHASES = [
  { id: 'p1', name: 'Launch', from: '2026-11-12', to: '2026-11-22',
    why: 'Get market-ready and get the first applications out the door.' },
  { id: 'p2', name: 'Build pipeline before the holidays', from: '2026-11-23', to: '2026-12-20',
    why: 'November and December have fewer postings and fewer applicants. Recruiters are also lining up January headcount now, so this is when you get into their pipelines.' },
  { id: 'p3', name: 'Holiday hold', from: '2026-12-21', to: '2027-01-03',
    why: 'Hiring slows to a crawl for two weeks. Stay warm, update your numbers, and load the January list.' },
  { id: 'p4', name: 'January surge', from: '2027-01-04', to: '2027-01-31',
    why: 'New budgets unlock new headcount. January brings the most new postings of the year, so this is your highest-volume month.' },
  { id: 'p5', name: 'Interview season', from: '2027-02-01', to: '2027-03-26',
    why: 'Screens and interviews bunch up in February and offers tend to land in March. Keep the Monday and Friday rhythm and let interview prep take over the Friday block.' }
];

const mon = (date, title, o = {}) => {
  const apps = o.apps ?? 5, msgs = o.msgs ?? 5, m = o.mins || [10, 15, 60, 25, 10];
  return { date, kind: 'pipeline', title, apps, msgs, reps: 0, note: o.note || '', steps: [
    [m[0], o.first || 'Clear the inbox. Reply to recruiters, update stages in the tracker, and send any follow-ups marked due.', 'pipeline:tracker'],
    [m[1], o.source || 'Pull ' + apps + ' new roles from your saved searches and add them as targets.', 'pipeline:find'],
    [m[2], 'Apply to ' + apps + ' roles. About 12 minutes each: tailor the summary and skills line, submit, log it.', 'pipeline:tracker'],
    [m[3], o.outreach || 'Send ' + msgs + ' messages, one to the recruiter or hiring manager behind each application.', 'pipeline:messages'],
    [m[4], o.last || 'Log everything and put a next step on every open role.', 'pipeline:tracker']
  ] };
};

const fri = (date, title, drill, o = {}) => ({
  date, kind: 'practice', title, apps: o.apps ?? 3, msgs: 0, reps: o.reps ?? 4, note: o.note || '', steps: [
    [10, 'Pipeline check. Follow up on anything you applied to a week ago that has gone quiet.', 'pipeline:tracker'],
    [45, drill, o.go || 'practice:drill'],
    [40, 'Apply to 3 roles and log them.', 'pipeline:tracker'],
    [15, o.social || 'LinkedIn: leave 3 real comments on posts from people at companies you are targeting.', 'profile:linkedin'],
    [10, 'Check the scoreboard against pace and pick Monday\'s roles.', 'today']
  ] });

const off = (date, title, text, o = {}) => ({
  date, kind: 'off', title, apps: 0, msgs: 0, reps: o.reps ?? 0, note: '', steps: text ? [[o.min || 20, text, o.go || 'practice:terms']] : [] });

const SESSIONS = [
  /* Phase 1 */
  { date: '2026-11-12', kind: 'launch', title: 'Launch day', apps: 3, msgs: 2, reps: 0,
    note: 'This is your one extra block. By the end of it you have a resume and profile that say seller, and three applications in.', steps: [
    [40, 'Resume. Paste the Account Executive version, fill in your numbers, save it as a PDF.', 'profile:resume'],
    [30, 'LinkedIn essentials. Do the first six items on the list: update sharing off, headline, About, top skills, Open to Work for recruiters only, and the Drift Net entry.', 'profile:linkedin'],
    [40, 'Apply to your first 3 roles from the starter list. Confirm each posting is still open before you start.', 'pipeline:tracker'],
    [10, 'Message the recruiter or hiring manager on 2 of them.', 'pipeline:messages']
  ] },
  { date: '2026-11-13', kind: 'practice', title: 'Finish the profile, start the reps', apps: 3, msgs: 0, reps: 4, note: '', steps: [
    [35, 'LinkedIn, the rest of the list: experience entries, custom URL, location, skills and Featured.', 'profile:linkedin'],
    [15, 'Ask 2 people for a sales-focused recommendation, and line up 3 references.', 'pipeline:messages'],
    [30, 'Story bank. Draft stories 1, 3 and 7 with real numbers.', 'practice:stories'],
    [25, 'Apply to 3 roles and log them.', 'pipeline:tracker'],
    [15, 'Out loud, timed, twice each: "Walk me through your background" and "Why are you looking to leave?"', 'practice:questions']
  ] },
  mon('2026-11-16', 'First full pipeline day', {
    source: 'Set up 3 job alerts from the saved searches, then add 5 roles as targets.' }),
  fri('2026-11-20', 'Deal stories',
    'Tell stories 1 and 7 out loud at two minutes each, twice. Then answer "Walk me through a deal you won" and "Tell me about a deal you lost."',
    { go: 'practice:stories' }),

  /* Phase 2 */
  mon('2026-11-23', 'Thanksgiving week: warm up your network', {
    outreach: 'Send 5 reconnect notes to former colleagues and managers. The holiday is an easy reason to write.' }),
  off('2026-11-27', 'Day after Thanksgiving', 'Optional: 20 minutes of Terms flashcards on your phone.', { reps: 2 }),
  mon('2026-11-30', 'Follow-up Monday', {
    first: 'Follow up on every November application that has gone quiet, then update stages in the tracker.' }),
  fri('2026-12-04', 'Mock discovery call',
    'Run the mock discovery call with Claude playing the buyer. Do it twice. The second time, cut your own talking in half.',
    { go: 'practice:mock' }),
  mon('2026-12-07', 'Go straight to hiring managers', {
    outreach: 'Message 5 hiring managers at companies on your list, whether or not they have a posting up.' }),
  fri('2026-12-11', 'Objections and the cold call',
    'Drill the three objection answers until they are automatic, then run the cold call role-play with Claude.',
    { go: 'practice:questions' }),
  mon('2026-12-14', 'Last push before the freeze', {
    outreach: 'Message 5 people, and ask every recruiter you have talked to what they expect to open in January.' }),
  fri('2026-12-18', 'Process, qualifying, forecasting',
    'Answer the pipeline, discovery, qualifying and forecasting questions out loud. Then walk one real deal through MEDDPICC using the Terms list.',
    { go: 'practice:questions' }),

  /* Phase 3 */
  mon('2026-12-21', 'Holiday notes and the January list', { apps: 3, msgs: 5, mins: [10, 35, 40, 25, 10],
    source: 'Build your January list: 25 companies you would say yes to. Follow each careers page and add the open roles as targets.',
    outreach: 'Send 5 short holiday notes to people who have helped so far.' }),
  off('2026-12-25', 'Christmas Day', ''),
  { date: '2026-12-28', kind: 'pipeline', title: 'Reset for January', apps: 3, msgs: 3, reps: 0, note: '', steps: [
    [30, 'Update Your numbers with full-year results, then refresh the resume and LinkedIn to match.', 'profile:numbers'],
    [15, 'Refresh your job alerts and add roles posted this week.', 'pipeline:find'],
    [40, 'Apply to 3 roles and log them.', 'pipeline:tracker'],
    [25, 'Message 3 recruiters or hiring managers.', 'pipeline:messages'],
    [10, 'Plan the first week of January: which 6 roles go first.', 'pipeline:tracker']
  ] },
  off('2027-01-01', 'New Year\'s Day', 'Optional: 15 minutes of Terms flashcards.', { min: 15 }),

  /* Phase 4 */
  mon('2027-01-04', 'Surge, week 1', { apps: 6, msgs: 6, mins: [10, 10, 70, 20, 10],
    outreach: 'Send the new-year note to every recruiter and hiring manager you have talked to since November.' }),
  fri('2027-01-08', 'Demo and 30-60-90',
    'Draft a 30-60-90 day plan for one company on your list, then present it out loud in five minutes.',
    { go: 'practice:questions' }),
  mon('2027-01-11', 'Surge, week 2', { apps: 6, msgs: 6, mins: [10, 10, 70, 20, 10] }),
  fri('2027-01-15', 'Full mock loop, round 1',
    'Recruiter screen, then hiring manager interview, back to back with Claude and scored. Redo your two weakest answers.',
    { go: 'practice:mock', reps: 6 }),
  mon('2027-01-18', 'Surge, week 3', { apps: 6, msgs: 6, mins: [10, 10, 70, 20, 10],
    note: 'Martin Luther King Jr. Day. Many offices are closed, so expect replies on Tuesday.' }),
  fri('2027-01-22', 'Pay and negotiation',
    'Practice the pay answer and the offer conversation out loud. Pick the five questions you will ask every hiring manager.',
    { go: 'pipeline:pay' }),
  mon('2027-01-25', 'Double down on what converts', { apps: 6, msgs: 6, mins: [10, 10, 70, 20, 10],
    source: 'Open the tracker and compare your results by source. Pull 6 roles from whichever lane is getting you screens.' }),
  fri('2027-01-29', 'Full mock loop, round 2',
    'Mock discovery call, then the hard questions on your job changes and your account manager title. Finish by noting which stories land and which still wobble.',
    { go: 'practice:mock', reps: 6 })
];

/* Phase 5 is the same rhythm every week, generated so the page keeps giving you a block after January. */
(function () {
  const d = new Date(2027, 1, 1), end = new Date(2027, 2, 26);
  while (d <= end) {
    const day = d.getDay();
    if (day === 1 || day === 5) {
      const s = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      if (day === 1) {
        SESSIONS.push(mon(s, 'Pipeline day', {
          note: s === '2027-02-15' ? 'Presidents\' Day. Some offices are closed.' : '' }));
      } else {
        SESSIONS.push(fri(s, 'Interview prep',
          'If you have an interview coming, prepare for that company: research brief, likely questions, your five questions. If not, drill your two lowest-rated questions.'));
      }
    }
    d.setDate(d.getDate() + 1);
  }
})();
SESSIONS.forEach(s => { s.id = 's' + s.date.replace(/-/g, '').slice(2); });

const PLAN_END = '2027-01-31'; /* headline targets run from Nov 12 through this date */

const RULES = [
  ['Every application gets a person.',
   'Cold applications turn into interviews about 3% of the time. Referrals land closer to 40%. Each time you apply, message the recruiter or hiring manager in the same block.'],
  ['Interviews beat applications.',
   'When you have a live interview, its prep replaces that Friday\'s drill and that Friday\'s applications.'],
  ['Answer recruiters within one business day.',
   'Even on a Tuesday. It takes five minutes on your phone, and speed is the first thing they notice.'],
  ['Offer Monday and Friday first.',
   'When a recruiter asks for times, lead with your work-from-home days. Use your own phone, laptop and email for all of it, on your own time.'],
  ['Log it before you close the tab.',
   'The tracker is how you will know by January which lane and which kind of outreach is working.']
];

const ALSO = [
  ['Three references, lined up now', 'A former manager from Drift Net or Scholastic, a customer, and a peer. Ask before you need them, and tell each one what you would like them to speak to.'],
  ['Titles and dates that verify', 'Background checks confirm employers, titles and dates. Use the titles each company would confirm and let the bullets carry the detail. Resume and LinkedIn must match to the month.'],
  ['Your Quill paperwork', 'Reread your offer letter and anything you signed for non-compete or non-solicit terms before you accept a new role. If something is unclear, ask an employment lawyer.'],

/* ================= sync (only inside a Claude artifact; GitHub Pages saves in the browser) ================= */
const sync = (() => {
  let refs = null, state = 'none', timer = null, busy = false;
  const dirty = {};
  const hasDirty = () => Object.keys(dirty).length > 0;
  const limit = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);
  const fatal = e => { const c = e && e.code; return !!c && c !== 'unavailable' && c !== 'timeout' && c !== 'resource_exhausted'; };
  const schedule = ms => { clearTimeout(timer); timer = setTimeout(flush, ms); };

  async function start() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    try {
      const got = await Promise.all([c.use('db'), c.use('user')]);
      if (!got[0] || !got[1]) return;
      const uid = await got[1].id();
      if (!uid) return;
      refs = {};
      Object.keys(PARTS).forEach(p => { refs[p] = got[0].doc('data/users/' + uid + '/' + p); });
      state = 'on';
      paintStatus();
      await pull();
    } catch (e) { state = 'none'; }
    paintStatus();
  }
  async function pull() {
    if (state !== 'on') return;
    let changed = false;
    for (const p of Object.keys(PARTS)) {
      if (dirty[p]) continue;
      try {
        const snap = await limit(refs[p].get(), 10000);
        const body = snap && snap.exists ? snap.data() : null;
        const rt = body && typeof body.t === 'number' ? body.t : 0;
        if (body && body.data && rt > (S.pt[p] || 0)) {
          const copy = JSON.parse(JSON.stringify(body.data));
          PARTS[p].forEach(k => { if (k in copy) S[k] = copy[k]; });
          S.pt[p] = rt; changed = true;
        } else if ((S.pt[p] || 0) > rt) dirty[p] = true;
      } catch (e) { if (fatal(e)) { state = 'off'; break; } }
    }
    if (changed) { S = adopt(S); saveLocal(); render(); }
    if (state === 'on' && hasDirty()) schedule(300);
    paintStatus();
  }
  function queue(p) { if (state !== 'on') return; dirty[p] = true; schedule(1800); paintStatus(); }
  async function flush() {
    if (state !== 'on') return;
    if (busy) { schedule(1000); return; }
    busy = true;
    for (const p of Object.keys(dirty)) {
      delete dirty[p];
      const body = { t: S.pt[p], v: 1, data: {} };
      PARTS[p].forEach(k => { body.data[k] = S[k]; });
      try { await refs[p].set(JSON.parse(JSON.stringify(body))); }
      catch (e) { if (fatal(e)) { state = 'off'; break; } dirty[p] = true; }
    }
    busy = false;
    if (state === 'on' && hasDirty()) schedule(4000 + Math.random() * 3000);
    paintStatus();
  }
  return { start, pull, queue, get state() { return state; }, get pending() { return busy || hasDirty(); } };
})();

function paintStatus() {
  const el = $('#status'); if (!el) return;
  if (sync.state === 'on') { el.dataset.state = sync.pending ? 'busy' : 'ok'; el.textContent = sync.pending ? 'Saving' : 'Saved to your account'; }
  else if (storeOK) { el.dataset.state = 'local'; el.textContent = 'Saved in this browser'; }
  else { el.dataset.state = 'off'; el.textContent = 'Not saving here. Use Backup.'; }
}

function inline(s) {
  const re = /\{\{(\w+)\|([^}]+)\}\}|\[([^\]]+)\]/g; let out = '', i = 0, m;
  while ((m = re.exec(s))) {
    out += esc(s.slice(i, m.index));
    if (m[1]) { const v = numVal(m[1]); out += v ? '<span class="num-ok">' + esc(v) + '</span>' : '<span class="num-no">' + esc(m[2]) + '</span>'; }
    else out += '<span class="blank">[' + esc(m[3]) + ']</span>';
    i = re.lastIndex;
  }
  return out + esc(s.slice(i));
}
function rich(t) {
  return t.split(/\n{2,}/).map(block => {
    let html = '', para = [], list = [];
    const endP = () => { if (para.length) { html += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };
    const endL = () => { if (list.length) { html += '<ul>' + list.map(l => '<li>' + inline(l) + '</li>').join('') + '</ul>'; list = []; } };
    block.split('\n').forEach(l => { if (/^- /.test(l)) { endP(); list.push(l.slice(2)); } else { endL(); para.push(l); } });
    endP(); endL(); return html;
  }).join('');
}

}

function scoreRow(label, sub, actual, total, pace, extra) {
  const w = total ? Math.min(100, actual / total * 100) : 0, tick = pace > 0 && pace < total ? pace / total * 100 : null;
  let pill = '';
  if (pace === null) pill = '';
  else if (pace === 0) pill = '';
  else if (actual >= pace) pill = '<span class="pill good">On pace</span>';
  else pill = '<span class="pill ' + (actual >= pace * 0.7 ? 'warn' : 'bad') + '">' + (pace - actual) + ' behind pace</span>';
  return '<li><div class="lab">' + label + '<small>' + sub + '</small></div><div class="num">' + actual + '<span> / ' + total + '</span></div>' +
    '<div class="meter"><i style="width:' + w.toFixed(1) + '%"></i>' + (tick !== null ? '<b style="left:' + tick.toFixed(1) + '%"></b>' : '') + '</div>' +
    '<div class="foot">' + pill + (extra || '') + '</div></li>';
}

}

function calcOut() {
  const c = S.calc, n = planTotal('apps'), warm = (Number(c.warm) || 0) / 100;
  const iv = n * (warm * (Number(c.warmRate) || 0) / 100 + (1 - warm) * (Number(c.cold) || 0) / 100);
  const offers = iv * (Number(c.offer) || 0) / 100;
  const cold = n * (Number(c.cold) || 0) / 100;
  return '<p><strong>' + n + ' applications</strong> on these assumptions lead to about <strong>' + iv.toFixed(1) + ' first interviews</strong> and <strong>' + offers.toFixed(1) + ' offers</strong>.</p>' +
    '<p class="note">With no messages at all, the same ' + n + ' applications would produce about ' + cold.toFixed(1) + ' interviews.</p>';
}

      next: applied ? 'Follow up if quiet' : 'Apply', nextDate: applied ? addDays(today(), 7) : '', contact: '', fu: false });
    draft = { company: '', role: '', link: '', lane: draft.lane, pay: '' };
    open.add('d-app-' + id); open.delete('d-add'); if (S.ui.afilter === 'closed' || S.ui.afilter === 'live') S.ui.afilter = 'open';
    commit('apps'); render(); toast(applied ? 'Logged. Now message someone there.' : 'Added to targets');
  },
  applied: el => {
    const a = S.apps.find(x => x.id === el.dataset.id); if (!a) return;
    setAppField(a, 'stage', 'applied'); a.applied = today(); a.next = 'Follow up if quiet'; a.nextDate = addDays(today(), 7);
    commit('apps'); render(); toast('Logged. Now message someone there.');
  },
  fu: el => {
    const a = S.apps.find(x => x.id === el.dataset.id); if (!a) return;
    a.fu = true; a.next = 'Wait for a reply'; a.nextDate = ''; S.msgs[today()] = (S.msgs[today()] || 0) + 1;
    commit('apps'); commit('main'); render(); toast('Follow-up logged');
  },
  del: el => {
    const id = el.dataset.id;
    if (confirmDel !== id) { confirmDel = id; render(); return; }
    S.apps = S.apps.filter(x => x.id !== id); confirmDel = null; open.delete('d-app-' + id);
    commit('apps'); render(); toast('Deleted');
  },
  csv: async () => {
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const rows = [['Company', 'Role', 'Lane', 'Stage', 'Applied', 'How', 'Next step', 'Next date', 'Contact', 'Pay', 'Link', 'Notes']].concat(
      S.apps.map(a => [a.company, a.role, laneName(a.lane), stageName(a.stage), a.applied, (SRC.find(s => s[0] === a.src) || ['', ''])[1], a.next, a.nextDate, a.contact, a.pay, a.link, a.notes]));
    const text = rows.map(r => r.map(q).join(',')).join('\n');
    if (await copyText(text)) toast('Copied. Paste it into a spreadsheet.'); else showText('Tracker as CSV', text, 'Select the text and copy it into a spreadsheet.');
  },
  qcat: el => { S.ui.qcat = el.dataset.c; saveLocal(); render(); },
  rate: el => {
    const q = el.dataset.q, c = Number(el.dataset.c);
    logRep(q, c); commit('main');
    if (S.ui.tab === 'practice' && S.ui.sub.practice === 'drill') pickDrill();
    render(); toast('Rep logged: ' + CONF[c] + '. ' + S.reps.length + ' total.');
  },
  clock: () => {
    if (drill.run) { stopClock(); render(); return; }
    drill.run = true;
    drill.timer = setInterval(() => { drill.left -= 1; const c = $('#clock'); if (!c) { stopClock(); return; } c.textContent = clockText(); c.classList.toggle('over', drill.left < 0); }, 1000);
    render();
  },
  skip: () => { pickDrill(); render(); },
  show: () => { drill.shown = true; render(); },
  cardshow: () => { cards.shown = true; render(); },
  cardnext: () => {
    cards.i += 1; cards.shown = false; cards.seen += 1;
    if (cards.seen % 10 === 0) { logRep('terms', 2); commit('main'); toast('Ten cards. One rep logged.'); }
    render();
  },
  mock: el => {
    const p = PROMPTS.find(x => x.id === el.dataset.id); if (!p) return;
    for (let i = 0; i < p.reps; i++) logRep('mock:' + p.id, 2);
    commit('main'); render(); toast(plural(p.reps, 'rep') + ' logged');
  },
  backup: () => {
    $('#bk-out').value = JSON.stringify(S); $('#bk-in').value = ''; $('#bk-msg').textContent = '';
    $('#bk-where').textContent = sync.state === 'on' ? 'Your progress is saved to your Claude account and follows you across devices that open this page.' :
      storeOK ? 'Your progress is saved in this browser only. To move it, copy the backup here and load it on the other device.' : 'This browser is not letting the page save. Copy a backup before you close the tab.';
    const d = $('#bk'); if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  },
  bkcopy: async () => { if (await copyText($('#bk-out').value)) toast('Backup copied'); else { $('#bk-out').focus(); $('#bk-out').select(); } },
  bkload: () => {
    let raw = null;
    try { raw = JSON.parse($('#bk-in').value); } catch (e) {}
    if (!raw || raw.v !== 1 || !Array.isArray(raw.apps)) { $('#bk-msg').textContent = 'That is not a backup from this page. Paste the full text and try again.'; return; }
    const ui = S.ui; S = adopt(raw); S.ui = ui; Object.keys(PARTS).forEach(p => commit(p));
    $('#bk').close(); render(); toast('Backup loaded');
  },
  bkreset: el => {
    if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Tap again to erase everything'; return; }
    S = fresh(); Object.keys(PARTS).forEach(p => commit(p));
    el.dataset.sure = ''; el.textContent = 'Start over'; $('#bk').close(); render(); toast('Reset');
  },
  close: el => { const d = el.closest('dialog'); if (d) d.close(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) { if (el.dataset.act !== 'del') confirmDel = null; fn(el, e); }
});
document.addEventListener('input', e => {
  const el = e.target, path = el.dataset && el.dataset.bind; if (!path) return;
  const part = bind(path, el.value); if (part) commit(part, true); afterBind(path);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.ck) {
    if (el.checked) S.checks[el.dataset.ck] = today(); else delete S.checks[el.dataset.ck];
    commit('main'); render(); return;
  }
  if (el.dataset.actChange === 'dcat') { S.ui.dcat = el.value; saveLocal(); pickDrill(); render(); }
});
document.addEventListener('toggle', e => { const d = e.target; if (d && d.tagName === 'DETAILS' && d.id) { if (d.open) open.add(d.id); else open.delete(d.id); } }, true);
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (VIEWS[t] && t !== S.ui.tab) { S.ui.tab = t; saveLocal(); render(); window.scrollTo(0, 0); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (saveTimer) saveLocal(); } else sync.pull(); });
window.addEventListener('pagehide', () => { if (saveTimer) saveLocal(); });

/* test hooks, harmless in normal use */
window.__ae = { setToday: d => { fakeToday = d; render(); }, state: () => S, sync, plain, planTotal, data: { SESSIONS, PHASES, HEADLINES, ABOUT, MSGS, QS, TERMS, NUMS, STORIES, LINKEDIN, PROMPTS, SEEDS } };

(function boot() {
  const h = location.hash.slice(1);
  if (VIEWS[h]) S.ui.tab = h;
  render(); paintStatus(); sync.start();
})();

})();
</script>
</body>
</html>
